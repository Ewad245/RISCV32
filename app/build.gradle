// --- Cấu hình PMD ---
pmd {
    // Nâng cấp lên phiên bản PMD mới nhất
    toolVersion = "7.24.0" 
    
    ignoreFailures = false
    
    // PMD 7 khuyến khích sử dụng tệp ruleset.xml tùy biến thay vì khai báo chuỗi trực tiếp.
    // Nếu bạn muốn dùng trực tiếp các tập luật mặc định của hệ thống:
    ruleSets = [
        "category/java/errorprone.xml", 
        "category/java/bestpractices.xml"
    ]
}

